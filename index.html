<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="./brand/icon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CCBPedia —— 二刺猿笑传之猜猜呗 赛事数据百科：赛事、对局、选手与积分。" />
    <title>CCBPedia · 猜猜呗赛事百科</title>
    <script>
      // 首屏前确定主题，避免闪烁
      (function () {
        try {
          var saved = localStorage.getItem('ccbpedia-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
